    <path d="M 550 200 C 655 200, 708 180, 765 119 S 863 0, 924 87 S 1002 199, 1090 133" stroke="#efbd73" opacity="1"/>
    <path d="M 550 205 C 655 205, 708 178, 765 123 S 863 8, 924 92 S 1002 202, 1090 139" stroke="#68ccbf" opacity="0.56"/>
    <path d="M 550 210 C 655 210, 708 176, 765 127 S 863 16, 924 97 S 1002 205, 1090 145" stroke="#68ccbf" opacity="0.59"/>
    <path d="M 550 215 C 655 215, 708 174, 765 131 S 863 24, 924 102 S 1002 208, 1090 151" stroke="#68ccbf" opacity="0.62"/>
