<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 250" role="img" aria-labelledby="title desc">
  <title id="title">Prince Upadhyay</title>
  <desc id="desc">Independent researcher in India. A family of teal curves and a gold trace cross a dark field.</desc>
  <defs>
    <linearGradient id="sea"><stop stop-color="#0a2028"/><stop offset="1" stop-color="#104543"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8bc8ba" opacity=".24"/></pattern>
  </defs>
  <style>
    @keyframes drift { to { transform: translateY(-7px); } }
    @keyframes travel { to { stroke-dashoffset: -640; } }
    @media (prefers-reduced-motion: no-preference) {
      .waves { animation: drift 6s ease-in-out infinite alternate; }
      .trace { animation: travel 8s linear infinite; }
    }
  </style>
  <rect width="1080" height="250" rx="15" fill="url(#sea)"/>
  <rect x="548" y="12" width="520" height="226" fill="url(#grid)"/>
